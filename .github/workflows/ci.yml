name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  crossbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make crossbuild

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and answer a query on amd64
        run: |
          docker build --build-arg VERSION=snapshot -t aegis:ci .
          docker run -d --name ci-amd64 -p 127.0.0.1:15380:53/udp aegis:ci
          sleep 2
          python3 .github/queries.py 127.0.0.1 15380
          docker rm -f ci-amd64 > /dev/null
      - name: Build and answer a query on arm64
        run: |
          docker buildx build --platform linux/arm64 --build-arg VERSION=snapshot -t aegis:ci-arm64 --load .
          docker run -d --name ci-arm64 --platform linux/arm64 -p 127.0.0.1:15381:53/udp aegis:ci-arm64
          sleep 3
          python3 .github/queries.py 127.0.0.1 15381
          docker rm -f ci-arm64 > /dev/null
      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the snapshot artifact set
        run: go run github.com/goreleaser/goreleaser/v2@v2.17.0 release --snapshot --clean
      - name: The snapshot binary reports its version, not dev
        run: |
          tar -xzf dist/aegis_*_linux_amd64.tar.gz -C dist
          out=$(./dist/aegis version)
          echo "$out"
          echo "$out" | grep -q "SNAPSHOT" || {
            echo "the released binary reports dev" >&2
            exit 1
          }
          test -f dist/checksums.txt
