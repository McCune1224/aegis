name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  crossbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make crossbuild

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and answer a query on amd64
        run: |
          docker build --build-arg VERSION=snapshot -t aegis:ci .
          docker run -d --name ci-amd64 -p 127.0.0.1:15380:53/udp -p 127.0.0.1:18080:8080 aegis:ci
          sleep 2
          python3 .github/queries.py 127.0.0.1 15380
          for _ in $(seq 1 10); do
            curl -sf http://127.0.0.1:18080/ | grep -q 'id="root"' && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/ | grep -q 'id="root"'
          docker rm -f ci-amd64 > /dev/null
      - name: Build and answer a query on arm64
        run: |
          docker buildx build --platform linux/arm64 --build-arg VERSION=snapshot -t aegis:ci-arm64 --load .
          docker run -d --name ci-arm64 --platform linux/arm64 -p 127.0.0.1:15381:53/udp aegis:ci-arm64
          sleep 3
          python3 .github/queries.py 127.0.0.1 15381
          docker rm -f ci-arm64 > /dev/null

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web bundle the binary embeds
        run: npm --prefix web ci && npm --prefix web run build
      - name: Build the snapshot artifact set
        run: go run github.com/goreleaser/goreleaser/v2@v2.17.0 release --snapshot --clean
      - name: The snapshot binary reports its version, not dev
        run: |
          tar -xzf dist/aegis_*_linux_amd64.tar.gz -C dist
          out=$(./dist/aegis version)
          echo "$out"
          echo "$out" | grep -q "SNAPSHOT" || {
            echo "the released binary reports dev" >&2
            exit 1
          }
          test -f dist/checksums.txt
      - name: The snapshot binary serves the app it embedded
        run: |
          ./dist/aegis serve --db /tmp/aegis-ci.db --dns-address 127.0.0.1:15353 \
            --api-address 127.0.0.1:18099 --upstream 127.0.0.1:1 --log-level error &
          server=$!
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:18099/ | grep -q 'id="root"' && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18099/ | grep -q 'id="root"'
          kill $server
