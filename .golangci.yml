version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gocritic
    - misspell
    - nilerr
    - noctx
    - prealloc
    - unconvert
    - unparam
    - whitespace
  settings:
    exhaustive:
      # Every enum here is table-driven, and a switch over one carries a
      # default that rejects what the tables do not name.
      default-signifies-exhaustive: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
